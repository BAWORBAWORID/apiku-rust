<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 — Under Maintenance | Zyyvor Api</title>
    <meta name="description" content="Zyyvor API is currently undergoing scheduled maintenance. Please try again shortly.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://api.zyvor.my.id/">
    <link rel="icon" href="/src/images/logo.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/src/images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-paper: #f7f1e5;
            --line-color: #e5d8c5;
            --text-main: #2b2b2b;
            --text-sub: #665f55;
            --text-muted: #8c8275;
            --accent-red: #8b2626;
            --card-white: #faf8f5;
            --card-yellow: #fceea7;
            --card-pink: #f9dbdb;
            --tape-color: #d1b48c;
            --border-color: #e0d5c1;
        }

        body {
            background-color: var(--bg-paper);
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 28px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2.5rem 2rem;
            max-width: 520px;
            width: 90%;
            background: var(--card-white);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 2px 8px 24px rgba(0,0,0,0.05);
        }

        /* Tape Effect di Atas Kertas */
        .container::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 24px;
            background: rgba(209, 180, 140, 0.45);
            border: 1px dashed rgba(0,0,0,0.1);
            pointer-events: none;
        }

        .error-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-red);
            background: var(--card-pink);
            border: 1px solid var(--border-color);
            padding: 0.35rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }

        .error-number {
            font-family: 'Caveat', cursive;
            font-size: clamp(5.5rem, 16vw, 8rem);
            font-weight: 700;
            line-height: 0.85;
            color: var(--accent-red);
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
            user-select: none;
        }

        .error-title {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .error-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--text-main);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #000000;
            transform: translateY(-1px);
            box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
        }

        .btn-secondary {
            background: var(--card-white);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--card-yellow);
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .footer-note {
            margin-top: 2.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--accent-red);
            font-style: italic;
            letter-spacing: 0.02em;
        }

        @media (max-width: 480px) {
            .actions { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 240px; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-badge">Status 503</div>
        <div class="error-number">503</div>
        <h1 class="error-title">Under Maintenance 🛠️</h1>
        <p class="error-desc">We are currently performing scheduled system upgrades to improve our API services. Please try again shortly.</p>
        <div class="actions">
            <button onclick="window.history.back()" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back
            </button>
            <button onclick="window.location.reload()" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                Reload
            </button>
        </div>
        <div class="footer-note">&copy; 2026-2027 Zyyvor Api'S. All rights reserved. &mdash; v<span id="v"></span></div>
    </div>
    <script>
        (async function() {
            try {
                const r = await fetch('/configuration');
                const c = await r.json();
                if (c.releases?.[0]?.version) document.getElementById('v').textContent = c.releases[0].version;
            } catch(e) {}
        })();
    </script>
</body>
</html>
