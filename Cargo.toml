recursion_limit = 256

[package]
name = "apiku-rs"
version = "2.1.2"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart", "gzip", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
dotenvy = "0.15"
dashmap = "6.0"
rand = "0.8"
scraper = "0.20"
urlencoding = "2.1"
md5 = { version = "0.10", package = "md-5" }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1.0"
futures-util = "0.3"
rsa = "0.9.10"
aes = "0.9.3"
once_cell = "1.19"
image = { version = "0.25", default-features = false, features = ["png","jpeg","webp"] }
cbc = { version = "0.2.1", features = ["block-padding"] }
crypto-common = "0.1"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
crc32fast = "1.4"
scrypt = { version = "0.11", default-features = false }
url = "2.5"
